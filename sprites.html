<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Money Inc. sprite gallery</title>
    <style>
      html,
      body {
        margin: 0;
        background: #2b2f3a;
        color: #e8e4d8;
        font: 12px/1.3 monospace;
      }
      #nav {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        padding: 6px 8px;
        background: #1f222b;
        border-bottom: 1px solid #444a5a;
      }
      #nav a {
        color: #f2d27a;
        text-decoration: none;
        padding: 2px 6px;
        border: 1px solid #444a5a;
        border-radius: 3px;
      }
      #nav a.on {
        background: #444a5a;
        color: #fff;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="nav"></div>
    <div id="out"></div>
    <script type="module" src="/src/spriteGallery.ts"></script>
  </body>
</html>
