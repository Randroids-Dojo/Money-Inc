<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Money Inc. — UI toolkit demo</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #34623a;
        overscroll-behavior: none;
      }
      #world {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        touch-action: none;
        cursor: grab;
      }
      #world.is-panning {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <script type="module" src="/src/uiDemo.ts"></script>
  </body>
</html>
